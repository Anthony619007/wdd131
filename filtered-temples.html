<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Temple Album - A stunning interactive gallery of sacred temples from around the world with dynamic filtering">
  <meta name="author" content="Anthony Anusiem - WDD 131 Student">
  
  <title>Temple Album | Sacred Temple Gallery | Interactive Filtering</title>

  <!-- Google Fonts preconnect links -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- External CSS files -->
  <link rel="stylesheet" href="temples.css">
  <link rel="stylesheet" href="temples-large.css">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-title">
        <span class="brand-icon">🕍</span>
        <span class="brand-text">Temple Album</span>
      </div>
      <button class="hamburger" id="hamburgerBtn" aria-label="Menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-x">✕</span>
      </button>
      <nav id="primaryNav">
        <ul class="nav-list">
          <li><a href="#" data-filter="all" class="active-nav">Home</a></li>
          <li><a href="#" data-filter="old">Old</a></li>
          <li><a href="#" data-filter="new">New</a></li>
          <li><a href="#" data-filter="large">Large</a></li>
          <li><a href="#" data-filter="small">Small</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1 id="dynamicTitle">Sacred Temple Gallery</h1>
    
    <div class="filter-stats" id="filterStats">
      <div class="stats-badge"><i class="fas fa-church"></i> <span id="templeCount">0</span> Temples</div>
      <div class="stats-badge"><i class="fas fa-filter"></i> <span id="activeFilterName">All Temples</span></div>
    </div>
    
    
    <div class="gallery-grid" id="templeGallery"></div>
  </main>

  <footer>
    <div class="footer-content">
      <p class="footer-copyright">
        <i class="far fa-copyright"></i> <span id="currentYear"></span> Temple Album • Anthony Anusiem
      </p>
      <p class="footer-last-modified">
        <i class="fas fa-sync-alt"></i> Last Modification: <span id="lastModified"></span>
      </p>
      <p class="footer-credit"><i class="fas fa-map-marker-alt"></i> Accra, Ghana</p>
    </div>
  </footer>

  <!-- External JavaScript - NO internal script tags -->
  <script src="filtered-temples.js"></script>
</body>
</html>
