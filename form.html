<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SmartPhone Reviewer product review form - Share your honest smartphone experience">
  <meta name="author" content="Anthony Anusiem">
  <title>SmartPhone Reviewer | Review Form</title>
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>
<div class="review-container">
  <header class="form-header">
    <h1>⚡ Smartphone Review</h1>
    <p>Share your real experience — help others choose the perfect device</p>
  </header>

  <form class="smart-review-form" method="get" action="review.html" id="phoneReviewForm">
    <!-- Product selection -->
    <div class="form-group">
      <label for="productName">📱 Product Name <span class="required-ast">*</span></label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>
    </div>

    <!-- Overall Rating - 5 hardcoded radio inputs -->
    <div class="form-group">
      <label>⭐ Overall Rating <span class="required-ast">*</span></label>
      <div class="rating-group">
        <div class="rating-option">
          <input type="radio" name="overallRating" id="rating_1" value="1" required>
          <label for="rating_1">1 ★ (★)</label>
        </div>
        <div class="rating-option">
          <input type="radio" name="overallRating" id="rating_2" value="2" required>
          <label for="rating_2">2 ★ (★★)</label>
        </div>
        <div class="rating-option">
          <input type="radio" name="overallRating" id="rating_3" value="3" required>
          <label for="rating_3">3 ★ (★★★)</label>
        </div>
        <div class="rating-option">
          <input type="radio" name="overallRating" id="rating_4" value="4" required>
          <label for="rating_4">4 ★ (★★★★)</label>
        </div>
        <div class="rating-option">
          <input type="radio" name="overallRating" id="rating_5" value="5" required>
          <label for="rating_5">5 ★ (★★★★★)</label>
        </div>
      </div>
      <small class="hint-text">Select a rating from 1 (poor) to 5 (excellent)</small>
    </div>

    <!-- Date of Installation -->
    <div class="form-group">
      <label for="installDate">📅 Date of Installation <span class="required-ast">*</span></label>
      <input type="date" id="installDate" name="installDate" required>
    </div>

    <!-- Useful Features - 8 hardcoded checkboxes -->
    <div class="form-group">
      <label>✅ Which features did you find useful?</label>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="feat_cam" name="usefulFeatures" value="Camera Quality">
          <label for="feat_cam">Camera Quality</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="feat_batt" name="usefulFeatures" value="Battery Life">
          <label for="feat_batt">Battery Life</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="feat_disp" name="usefulFeatures" value="Display Quality">
          <label for="feat_disp">Display Quality</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="feat_perf" name="usefulFeatures" value="Performance">
          <label for="feat_perf">Performance</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="feat_design" name="usefulFeatures" value="Design & Build">
          <label for="feat_design">Design & Build</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="feat_soft" name="usefulFeatures" value="Software Experience">
          <label for="feat_soft">Software Experience</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="feat_audio" name="usefulFeatures" value="Audio Quality">
          <label for="feat_audio">Audio Quality</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="feat_conn" name="usefulFeatures" value="Connectivity">
          <label for="feat_conn">Connectivity</label>
        </div>
      </div>
    </div>

    <!-- Additional Preferences - 4 hardcoded checkboxes (total 12 checkboxes) -->
    <div class="form-group">
      <label>📌 Additional Preferences</label>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="pref_recommend" name="additionalPrefs" value="Would recommend to others">
          <label for="pref_recommend">Would recommend to others</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="pref_repurchase" name="additionalPrefs" value="Would purchase again">
          <label for="pref_repurchase">Would purchase again</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="pref_value" name="additionalPrefs" value="Good value for money">
          <label for="pref_value">Good value for money</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="pref_durable" name="additionalPrefs" value="Durable and reliable">
          <label for="pref_durable">Durable and reliable</label>
        </div>
      </div>
    </div>

    <!-- Written Review -->
    <div class="form-group">
      <label for="writtenReview">✍️ Written Review <span class="optional-badge">Optional</span></label>
      <textarea id="writtenReview" name="writtenReview" rows="4" placeholder="Tell us more about your experience... (optional)"></textarea>
    </div>

    <!-- Your Name -->
    <div class="form-group">
      <label for="userName">👤 Your Name <span class="optional-badge">Optional</span></label>
      <input type="text" id="userName" name="userName" placeholder="e.g., Alex Johnson">
    </div>

    <!-- Centered Submit Button -->
    <div class="submit-area">
      <button type="submit" class="submit-btn">📲 Post Review & Continue</button>
    </div>
  </form>

  <footer class="assignment-footer">
    <div>©2024 ⚠️ Rubia Magdelena Francesco · Madagascar</div>
    <div>Last Modification: 02/26/2024 13:56:10 · <span id="reviewCountDisplay">Reviews: 0</span></div>
  </footer>
</div>

<script src="scripts/form.js" defer></script>
</body>
</html>
