<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SmartPhone Reviewer product review form - Share your honest smartphone experience">
    <meta name="author" content="Anthony Anusiem">
    <title>SmartPhone Reviewer | Review Form</title>
    <link rel="stylesheet" href="form.css" type="text/css">
</head>
<body>

    <div class="form-container">

        <header class="form-header">
            <h1>Smartphone Review</h1>
            <p>Rate your smartphone experience</p>
        </header>

        <main class="review-form">

            <form id="productReviewForm" method="get" action="review.html">

                <div class="form-group">
                    <label for="productNameSelect">
                        Product Name <span class="required-star">*</span>
                    </label>
                    <select id="productNameSelect" name="productName" required>
                        <option value="" disabled selected>Select a Product...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>
                        Overall Rating
                        <span class="required-star">*</span>
                    </label>
                    <div class="stars-container" id="starsRatingContainer"></div>
                </div>

                <div class="form-group">
                    <label for="installDate">
                        Date of Installation
                        <span class="required-star">*</span>
                    </label>
                    <input type="date" id="installDate" name="installDate" required>
                </div>

                <div class="form-group">
                    <label>Useful Features</label>
                    <div class="checkbox-group" id="featuresChecklist"></div>
                </div>

                <div class="form-group">
                    <label for="writtenReview">Written Review</label>
                    <textarea id="writtenReview" name="writtenReview" placeholder="Share your experience..."></textarea>
                </div>

                <div class="form-group">
                    <label for="userName">Your Name</label>
                    <input type="text" id="userName" name="userName" placeholder="Your name">
                </div>

                <button type="submit" class="submit-btn">
                    Submit Review
                </button>

            </form>

        </main>

        <footer class="footer-common">
            © 2026 Anthony Anusiem
        </footer>

    </div>

    <script src="form.js"></script>

</body>
</html>
