<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Share your smartphone experience. Rate features, installation date, and write a review to help others choose the perfect device.">
  <meta name="author" content="Anthony Anusiem">
  <title>Smartphone Review Form | Tech Insights</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>

<div class="review-container">
  <header class="form-header">
    <h1>⚡ Smartphone Review</h1>
    <p>Share your real experience — help others choose the perfect device</p>
  </header>

  <!-- ✅ FIXED: action="review.html" (non-empty) -->
  <form class="smart-review-form" method="get" action="review.html" id="phoneReviewForm">
    <!-- Product Name (dynamic select) -->
    <div class="form-group">
      <label for="productName">📱 Product Name <span class="required-ast">*</span></label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>
    </div>

    <!-- Overall Rating (stars) -->
    <div class="form-group">
      <label>⭐ Overall Rating <span class="required-ast">*</span></label>
      <div class="rating-group">
        <div class="star-rating" id="starRatingWidget"></div>
        <div class="rating-text">tap a star to rate (1–5)</div>
      </div>
      <small class="hint-text">Each radio button shares the same name to form a single selection group.</small>
    </div>

    <!-- Date of Installation -->
    <div class="form-group">
      <label for="installDate">📅 Date of Installation <span class="required-ast">*</span></label>
      <input type="date" id="installDate" name="installDate" required>
    </div>

    <!-- Useful Features (checkboxes) -->
    <div class="form-group">
      <label>✅ Which features did you find useful?</label>
      <div class="checkbox-group">
        <div class="checkbox-list" id="featuresChecklist"></div>
      </div>
    </div>

    <!-- Written Review (optional) -->
    <div class="form-group">
      <label for="writtenReview">✍️ Written Review <span class="optional-badge">Optional</span></label>
      <textarea id="writtenReview" name="writtenReview" rows="4" placeholder="Tell us more about your experience with this smartphone... (optional)"></textarea>
    </div>

    <!-- Your Name (optional) -->
    <div class="form-group">
      <label for="userName">👤 Your Name <span class="optional-badge">Optional</span></label>
      <input type="text" id="userName" name="userName" placeholder="e.g., Alex Johnson">
    </div>

    <!-- Submit button -->
    <div class="submit-area">
      <input type="submit" class="submit-btn" value="📲 Post Review & Continue">
    </div>
  </form>

  <footer class="assignment-footer">
    <div class="footer-left">©2024 ⚠️ Rubia Magdelena Francesco · Madagascar</div>
    <div class="footer-right">Last Modification: 02/26/2024 13:56:10 · <span id="reviewCountDisplay">Reviews: 0</span></div>
  </footer>
</div>

<script src="form.js"></script>
</body>
</html>
