<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Share your smartphone experience. Rate features, installation date, and write a review to help others choose the perfect device.">
  <meta name="author" content="Anthony Anusiem">
  <title>Smartphone Review Form | Tech Insights</title>
  <link rel="stylesheet" href="form.css">
  <style>
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
 
    body {
      background: linear-gradient(145deg, #e9eff5 0%, #dce3ec 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 2rem 1.5rem;
      color: #1a2c3e;
      min-height: 100vh;
    }
 
    .review-container {
      max-width: 880px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 2rem;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2), 0 2px 4px rgba(0,0,0,0.02);
      overflow: hidden;
    }
 
    .form-header {
      background: #0f2c3b;
      padding: 1.8rem 2rem;
      border-bottom: 4px solid #ffb347;
    }
 
    .form-header h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #f9f7f3;
      display: flex;
      align-items: center;
      gap: 10px;
    }
 
    .form-header p {
      color: #cfdfe8;
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }
 
    .smart-review-form {
      padding: 2rem 2rem 1.8rem;
    }
 
    .form-group {
      margin-bottom: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
 
    label {
      font-weight: 600;
      font-size: 1rem;
      color: #1e3a4d;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
 
    .required-ast {
      color: #c24b2a;
      font-size: 0.9rem;
    }
 
    .optional-badge {
      font-weight: normal;
      font-size: 0.7rem;
      background: #eef2f5;
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      margin-left: 0.75rem;
      color: #4a627a;
    }
 
    .hint-text {
      color: #507b9b;
      font-size: 0.75rem;
      margin-top: 0.25rem;
    }
 
    select, input[type="date"], input[type="text"], textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid #d4dee8;
      border-radius: 20px;
      font-size: 0.95rem;
      font-family: inherit;
      background-color: #fefefe;
      transition: all 0.2s;
      outline: none;
    }
 
    select:focus, input:focus, textarea:focus {
      border-color: #ffb347;
      box-shadow: 0 0 0 3px rgba(255,180,71,0.2);
    }
 
    /* ── Star Rating Widget ── */
    .rating-group {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.5rem;
      background: #f9fafc;
      padding: 1rem 1.2rem;
      border-radius: 48px;
      border: 1px solid #e2e8f0;
    }
 
    .star-rating-custom {
      display: flex;
      flex-direction: row;
      gap: 0.3rem;
      align-items: center;
    }
 
    .star-btn {
      font-size: 2.2rem;
      cursor: pointer;
      color: #cbd5e1;
      transition: transform 0.1s, color 0.15s;
      background: none;
      border: none;
      padding: 0 4px;
      line-height: 1;
    }
 
    .star-btn:hover {
      transform: scale(1.15);
      color: #ffb347;
    }
 
    .star-btn.active-star {
      color: #ffb347;
    }
 
    .rating-text {
      font-size: 0.85rem;
      background: #ffffff;
      padding: 0.4rem 0.9rem;
      border-radius: 30px;
      color: #2c5a74;
      font-weight: 500;
      min-width: 160px;
    }
 
    /* ── Checkboxes ── */
    .checkbox-group {
      background: #fefbf6;
      border-radius: 1.2rem;
      padding: 1rem 1.2rem;
      border: 1px solid #e9edf2;
    }
 
    .checkbox-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-top: 0.5rem;
    }
 
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
 
    .checkbox-item input[type="checkbox"] {
      width: 1.2rem;
      height: 1.2rem;
      accent-color: #ffb347;
      margin: 0;
    }
 
    .checkbox-item label {
      font-weight: 500;
      margin: 0;
      font-size: 0.95rem;
    }
 
    /* ── Submit ── */
    .submit-area {
      margin-top: 2rem;
      text-align: center;
    }
 
    .submit-btn {
      background: #0f2c3b;
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.9rem 2.2rem;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      max-width: 280px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
 
    .submit-btn:hover {
      background: #ff8c42;
      transform: translateY(-2px);
    }
 
    /* ── Footer ── */
    .assignment-footer {
      background: #f0f3f7;
      padding: 1rem 2rem;
      border-top: 1px solid #dce3ec;
      font-size: 0.75rem;
      color: #4f6f8f;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-family: monospace;
    }
 
    /* ── Responsive ── */
    @media (max-width: 600px) {
      .smart-review-form { padding: 1.5rem 1.2rem; }
      .form-header { padding: 1.5rem 1.2rem; }
      .form-header h1 { font-size: 1.5rem; }
      .rating-group { flex-direction: column; align-items: flex-start; border-radius: 24px; }
      .checkbox-list { gap: 1rem; flex-direction: column; }
      .star-btn { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<div class="review-container">
  <header class="form-header">
    <h1>⚡ Smartphone Review</h1>
    <p>Share your real experience — help others choose the perfect device</p>
  </header>
 
  <form class="smart-review-form" method="get" action="review.html" id="phoneReviewForm">
 
    <!-- Product Name -->
    <div class="form-group">
      <label for="productName">📱 Product Name <span class="required-ast">*</span></label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>
    </div>
 
    <!-- Overall Rating — clean interactive star widget -->
    <div class="form-group">
      <label>⭐ Overall Rating <span class="required-ast">*</span></label>
      <div class="rating-group">
        <div class="star-rating-custom" id="starContainer" role="radiogroup" aria-label="Overall Rating"></div>
        <div class="rating-text" id="ratingLabel">Tap a star to rate (1–5)</div>
      </div>
      <!-- hidden field carries the value on form submit -->
      <input type="hidden" id="ratingValue" name="rating" value="">
    </div>
 
    <!-- Date of Installation -->
    <div class="form-group">
      <label for="installDate">📅 Date of Installation <span class="required-ast">*</span></label>
      <input type="date" id="installDate" name="installDate" required>
    </div>
 
    <!-- Useful Features -->
    <div class="form-group">
      <label>✅ Which features did you find useful?</label>
      <div class="checkbox-group">
        <div class="checkbox-list" id="featuresChecklist"></div>
      </div>
    </div>
 
    <!-- Written Review -->
    <div class="form-group">
      <label for="writtenReview">✍️ Written Review <span class="optional-badge">Optional</span></label>
      <textarea id="writtenReview" name="writtenReview" rows="4"
        placeholder="Tell us more about your experience with this smartphone... (optional)"></textarea>
    </div>
 
    <!-- Your Name -->
    <div class="form-group">
      <label for="userName">👤 Your Name <span class="optional-badge">Optional</span></label>
      <input type="text" id="userName" name="userName" placeholder="e.g., Alex Johnson">
    </div>
 
    <!-- Submit -->
    <div class="submit-area">
      <input type="submit" class="submit-btn" value="📲 Post Review & Continue">
    </div>
  </form>
 
  <footer class="assignment-footer">
    <div>©2024 ⚠️ Rubia Magdelena Francesco · Madagascar</div>
    <div>Last Modification: 02/26/2024 13:56:10 · <span id="reviewCountDisplay">Reviews: 0</span></div>
  </footer>
</div>
 
<script>
  // ── Data ──────────────────────────────────────────────────────
  const productArray = [
    { id: "ph_001", name: "Galaxy Nexus X" },
    { id: "ph_002", name: "iPhone 15 Pro Max" },
    { id: "ph_003", name: "Pixel 9 Ultra" },
    { id: "ph_004", name: "OnePlus 12T" },
    { id: "ph_005", name: "Xiaomi 14 Pro" },
    { id: "ph_006", name: "Nothing Phone (3)" },
    { id: "ph_007", name: "Sony Xperia 5 V" }
  ];
 
  const featuresList = [
    { id: "feat_dura",   name: "Durability",   value: "Durability" },
    { id: "feat_ease",   name: "Ease of Use",  value: "Ease of Use" },
    { id: "feat_perf",   name: "Performance",  value: "Performance" },
    { id: "feat_design", name: "Design",       value: "Design" }
  ];
 
  const ratingLabels = ['', 'Poor', 'Fair', 'Good', 'Very good', 'Excellent'];
 
  // ── Populate product dropdown ─────────────────────────────────
  function populateProductSelect() {
    const sel = document.getElementById("productName");
    productArray.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.name;
      sel.appendChild(opt);
    });
  }
 
  // ── Interactive star rating ───────────────────────────────────
  let selectedRating = 0;
 
  function paintStars(highlightUpTo) {
    document.querySelectorAll('.star-btn').forEach(btn => {
      const v = +btn.dataset.val;
      btn.classList.toggle('active-star', v <= highlightUpTo);
    });
    const label = document.getElementById('ratingLabel');
    label.textContent = highlightUpTo
      ? `⭐ ${ratingLabels[highlightUpTo]} (${highlightUpTo} / 5)`
      : (selectedRating ? `⭐ ${ratingLabels[selectedRating]} (${selectedRating} / 5)` : 'Tap a star to rate (1–5)');
  }
 
  function initStarRating() {
    const container = document.getElementById('starContainer');
    for (let i = 1; i <= 5; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'star-btn';
      btn.dataset.val = i;
      btn.setAttribute('aria-label', `Rate ${i} star${i > 1 ? 's' : ''}`);
      btn.textContent = '★';
 
      btn.addEventListener('mouseenter', () => paintStars(i));
      btn.addEventListener('mouseleave', () => paintStars(0));
      btn.addEventListener('click', () => {
        selectedRating = i;
        document.getElementById('ratingValue').value = i;
        paintStars(0);
      });
      container.appendChild(btn);
    }
    paintStars(0);
  }
 
  // ── Populate checkboxes ───────────────────────────────────────
  function populateCheckboxes() {
    const container = document.getElementById("featuresChecklist");
    featuresList.forEach(f => {
      const div = document.createElement("div");
      div.className = "checkbox-item";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.id = f.id;
      cb.name = "usefulFeatures";
      cb.value = f.value;
      const lbl = document.createElement("label");
      lbl.htmlFor = f.id;
      lbl.textContent = f.name;
      div.appendChild(cb);
      div.appendChild(lbl);
      container.appendChild(div);
    });
  }
 
  // ── Date max = today ──────────────────────────────────────────
  function setDateMax() {
    const d = document.getElementById("installDate");
    if (d) d.max = new Date().toISOString().split('T')[0];
  }
 
  // ── Review count (localStorage) ───────────────────────────────
  function getReviewCount() {
    const v = parseInt(localStorage.getItem("smartphoneReviewsCount"), 10);
    return isNaN(v) ? 0 : v;
  }
 
  function updateCountDisplay() {
    const el = document.getElementById("reviewCountDisplay");
    if (el) el.textContent = `Reviews: ${getReviewCount()}`;
  }
 
  function incrementReviewCount() {
    localStorage.setItem("smartphoneReviewsCount", getReviewCount() + 1);
    updateCountDisplay();
  }
 
  // ── Form validation & submit ──────────────────────────────────
  function setupForm() {
    const form = document.getElementById("phoneReviewForm");
    form.addEventListener("submit", e => {
      const product = document.getElementById("productName").value;
      if (!product) {
        e.preventDefault();
        alert("📱 Please select a smartphone product.");
        document.getElementById("productName").focus();
        return;
      }
 
      const rating = document.getElementById("ratingValue").value;
      if (!rating || +rating < 1 || +rating > 5) {
        e.preventDefault();
        alert("⭐ Please select an overall rating (1 to 5 stars).");
        return;
      }
 
      const installDate = document.getElementById("installDate").value;
      if (!installDate) {
        e.preventDefault();
        alert("📅 Please select the date of installation.");
        return;
      }
 
      const today = new Date().toISOString().split('T')[0];
      if (installDate > today) {
        e.preventDefault();
        alert("Installation date cannot be in the future.");
        return;
      }
 
      incrementReviewCount();
    });
  }
 
  // ── Init ──────────────────────────────────────────────────────
  document.addEventListener("DOMContentLoaded", () => {
    populateProductSelect();
    initStarRating();
    populateCheckboxes();
    setDateMax();
    setupForm();
    updateCountDisplay();
    window.addEventListener("storage", e => {
      if (e.key === "smartphoneReviewsCount") updateCountDisplay();
    });
    });
<script src="form.js" defer></script>
</body>
</html>
