<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Temple Album - A gallery of beautiful temples from around the world">
  <meta name="author" content="Anthony Anusiem - WDD 131 Student">
  
  <title>Temple Album | Sacred Temple Gallery</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-title">
        <span class="brand-icon">⛩️</span>
        <span class="brand-text">Temple Album</span>
      </div>
      <button class="hamburger" id="hamburgerBtn" aria-label="Menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-x">✕</span>
      </button>
      <nav id="primaryNav">
        <ul class="nav-list">
          <li><a href="#" class="active-nav">Home</a></li>
          <li><a href="#">Old</a></li>
          <li><a href="#">New</a></li>
          <li><a href="#">Large</a></li>
          <li><a href="#">Small</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Aba Temple Album</h1>
    <div class="gallery-grid">
      <figure class="temple-card">
        <img src="images/aba-temple.jpeg" alt="Aba Nigeria Temple - LDS Temple exterior" loading="lazy" width="400" height="300">
        <figcaption>Aba Nigeria Temple</figcaption>
      </figure>
      <figure class="temple-card">
        <img src="images/aba-temple.jpeg" alt="Aba Nigeria Temple - Angel Moroni statue" loading="lazy" width="400" height="300">
        <figcaption>Aba Nigeria Temple</figcaption>
      </figure>
      <figure class="temple-card">
        <img src="images/aba-temple.jpeg" alt="Aba Nigeria Temple - Gardens and grounds" loading="lazy" width="400" height="300">
        <figcaption>Aba Nigeria Temple</figcaption>
      </figure>
      <figure class="temple-card">
        <img src="images/aba-temple.jpeg" alt="Aba Nigeria Temple - Spire detail" loading="lazy" width="400" height="300">
        <figcaption>Aba Nigeria Temple</figcaption>
      </figure>
      <figure class="temple-card">
        <img src="images/aba-temple.jpeg" alt="Aba Nigeria Temple - Main entrance" loading="lazy" width="400" height="300">
        <figcaption>Aba Nigeria Temple</figcaption>
      </figure>
      <figure class="temple-card">
        <img src="images/aba-temple.jpeg" alt="Aba Nigeria Temple - Aerial view" loading="lazy" width="400" height="300">
        <figcaption>Aba Nigeria Temple</figcaption>
      </figure>
      <figure class="temple-card">
        <img src="images/aba-temple.jpeg" alt="Aba Nigeria Temple - Reflecting pool" loading="lazy" width="400" height="300">
        <figcaption>Aba Nigeria Temple</figcaption>
      </figure>
      <figure class="temple-card">
        <img src="images/aba-temple.jpeg" alt="Aba Nigeria Temple - Night view" loading="lazy" width="400" height="300">
        <figcaption>Aba Nigeria Temple</figcaption>
      </figure>
      <figure class="temple-card">
        <img src="images/aba-temple.jpeg" alt="Aba Nigeria Temple - Cultural celebration" loading="lazy" width="400" height="300">
        <figcaption>Aba Nigeria Temple</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p class="footer-copyright">
        &copy; <span id="currentYear"></span> Temple Album • Aba, Temple City, Nigeria.
      </p>
      <p class="footer-last-modified">
        Last Modification: <span id="lastModified"></span>
      </p>
      <p class="footer-credit">Aba, Temple City, Nigeria</p>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const primaryNav = document.getElementById('primaryNav');

      if (hamburgerBtn && primaryNav) {
        hamburgerBtn.addEventListener('click', function () {
          primaryNav.classList.toggle('open');
          hamburgerBtn.classList.toggle('active');
          const isExpanded = primaryNav.classList.contains('open');
          hamburgerBtn.setAttribute('aria-expanded', isExpanded);
        });
      }

      const currentYearSpan = document.getElementById('currentYear');
      if (currentYearSpan) {
        currentYearSpan.textContent = new Date().getFullYear();
      }

      const lastModifiedSpan = document.getElementById('lastModified');
      if (lastModifiedSpan) {
        const lastModified = document.lastModified;
        const formattedDate = new Date(lastModified).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
        lastModifiedSpan.textContent = formattedDate;
      }

      const navLinks = document.querySelectorAll('#primaryNav .nav-list a');
      navLinks.forEach(link => {
        link.addEventListener('click', function () {
          if (primaryNav && primaryNav.classList.contains('open')) {
            primaryNav.classList.remove('open');
            if (hamburgerBtn) {
              hamburgerBtn.classList.remove('active');
              hamburgerBtn.setAttribute('aria-expanded', 'false');
            }
          }
        });
      });

      const allNavAnchors = document.querySelectorAll('.nav-list a');
      allNavAnchors.forEach(anchor => {
        anchor.addEventListener('click', function(e) {
          allNavAnchors.forEach(a => a.classList.remove('active-nav'));
          this.classList.add('active-nav');
        });
      });

      const homeLink = document.querySelector('.nav-list a[href="#"]');
      if (homeLink && !document.querySelector('.nav-list a.active-nav')) {
        homeLink.classList.add('active-nav');
      }

      let resizeTimer;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          const windowWidth = window.innerWidth;
          if (windowWidth >= 768 && primaryNav && primaryNav.classList.contains('open')) {
            primaryNav.classList.remove('open');
            if (hamburgerBtn) {
              hamburgerBtn.classList.remove('active');
              hamburgerBtn.setAttribute('aria-expanded', 'false');
            }
          }
        }, 250);
      });
    });
  </script>
</body>
</html>
